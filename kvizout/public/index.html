<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Квізоут</title>
<link rel="stylesheet" href="/style.css">
<style>
  .hero{text-align:center;margin-bottom:26px}
  .hero .logo{font-size:4rem}
  .hero h2{font-size:2.4rem;margin:6px 0}
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .role{display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 20px;border-radius:14px;
        color:#fff;text-decoration:none;font-size:1.6rem;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.28);transition:transform .08s}
  .role:active{transform:translateY(4px);box-shadow:none}
  .role .ico{font-size:4rem}
  .role small{font-size:1rem;font-weight:400;opacity:.9}
  @media(max-width:600px){.roles{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <section class="screen active" style="max-width:760px">
    <div class="hero">
      <div class="logo">🎯</div>
      <h2>Квізоут</h2>
      <p class="muted">Вікторини в класі: питання на великому екрані, відповіді — на телефонах</p>
    </div>
    <div class="roles">
      <a class="role a1" href="/student"><span class="ico">🎓</span>Я учень<small>Увійти до гри</small></a>
      <a class="role a0" href="/teacher"><span class="ico">🧑‍🏫</span>Я вчитель<small>Потрібен код доступу</small></a>
    </div>
  </section>
</main>
</body>
</html>
