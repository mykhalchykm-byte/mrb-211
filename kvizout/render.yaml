services:
  - type: web
    name: kvizout
    runtime: node
    rootDir: kvizout        # package.json лежить у папці kvizout
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: TEACHER_CODE
        sync: false   # Render попросить ввести код вчителя під час створення сервісу
      - key: DATABASE_URL
        sync: false   # рядок підключення до PostgreSQL (Supabase/Neon) — без нього вікторини зникають після перезапуску
      - key: TELEGRAM_BOT_TOKEN
        sync: false   # токен бота від @BotFather (необов'язково)
      - key: PUBLIC_URL
        sync: false   # адреса сайту, наприклад https://mrb-211-1.onrender.com
